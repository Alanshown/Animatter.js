<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime integration fixture</title><style>body{min-height:140vh}button{width:160px;height:90px;margin:70px}#region{display:flex}#dialog{width:180px;height:80px}</style><body><div id="region"><button id="a" style="translate:2px 3px;rotate:1deg;--am-energy:.2;touch-action:pan-y">Native A</button><button id="b">Native B</button><input id="input" aria-label="Name"></div><div id="dialog" hidden>Presence</div><div id="adapters"></div><script type="module">import * as am from '/packages/core/dist/animatter.js';window.am=am;window.events=[];window.errors=[];window.world=am.createWorld({onError:e=>window.errors.push(String(e))});world.register(document.querySelector('#a'),{id:'a',draggable:true});world.register(document.querySelector('#b'),{id:'b'});world.register(document.querySelector('#input'),{id:'input'});world.register(document.querySelector('#dialog'),{id:'dialog'});world.on(e=>events.push({type:e.type,target:e.target,source:e.source,level:e.level}));window.nativeClicks=0;document.querySelector('#a').addEventListener('click',()=>nativeClicks++);window.ready=true;</script></body></html>
